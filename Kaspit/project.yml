name: Kaspit
options:
  bundleIdPrefix: com.eladsaar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
targets:
  Kaspit:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: כספית
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        NSFaceIDUsageDescription: כספית משתמשת ב-Face ID כדי לנעול את המידע הפיננסי שלך.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eladsaar.kaspit
        TARGETED_DEVICE_FAMILY: "1,2"
  KaspitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Kaspit
schemes:
  Kaspit:
    build:
      targets:
        Kaspit: all
    test:
      targets:
        - KaspitTests
